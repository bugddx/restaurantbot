spring:
  application:
    name: restaurantbot

  datasource:
    url: jdbc:postgresql://localhost:5432/restaurantbot
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: validate

    open-in-view: false
    show-sql: true

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

server:
  port: 8080

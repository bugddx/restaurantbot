spring:
  application:
    name: restaurantbot

  datasource:
    url: jdbc:postgresql://localhost:5432/restaurantbot
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: validate

    open-in-view: false

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    debug:  true
    url: jdbc:postgresql://localhost:5432/restaurantbot
    user: postgres
    password: postgres

server:
  port: 8080

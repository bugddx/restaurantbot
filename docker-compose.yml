services:

  postgres:
    image: postgres:16

    container_name: restaurantbot-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: restaurantbot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7

    container_name: restaurantbot-redis

    restart: unless-stopped

    ports:
      - "6379:6379"

volumes:
  postgres-data:
